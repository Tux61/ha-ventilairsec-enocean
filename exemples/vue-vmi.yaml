# Vue d'exemple en deux colonnes pour l'add-on Ventilairsec VMI EnOcean : pilotage à
# gauche, graphiques à droite (une seule colonne sur téléphone). Mêmes cartes que
# carte-vmi.yaml. Pour l'utiliser : Modifier le tableau de bord → ajouter une vue →
# ⋮ → Modifier en YAML, puis coller ce contenu. Les graphiques demandent
# mini-graph-card et apexcharts-card (HACS). Adaptez les noms d'entités si les vôtres
# diffèrent.
title: VMI
path: vmi
icon: mdi:fan
type: sections
max_columns: 2
sections:
  # === Colonne de gauche : pilotage ==========================================
  - type: grid
    cards:
      - type: heading
        heading: VMI Purevent
        heading_style: title
      - type: vertical-stack
        cards:
          # --- En-tête : mode de fonctionnement --------------------------------------
          - type: tile
            entity: select.vmi_ventilairsec_mode
            name: VMI Purevent
            icon: mdi:fan
            color: blue
            state_content:
              - state
              - last-changed

          # --- Choix du débit : 3 boutons, le mode actif est coloré -------------------
          - type: grid
            columns: 3
            square: false
            cards:
              - type: conditional
                conditions:
                  - condition: state
                    entity: select.vmi_ventilairsec_mode
                    state: Eco
                card:
                  type: tile
                  entity: select.vmi_ventilairsec_mode
                  name: Eco
                  icon: mdi:leaf
                  color: green
                  hide_state: true
                  vertical: true
                  tap_action:
                    action: perform-action
                    perform_action: select.select_option
                    target:
                      entity_id: select.vmi_ventilairsec_mode
                    data:
                      option: Eco
                  icon_tap_action:
                    action: perform-action
                    perform_action: select.select_option
                    target:
                      entity_id: select.vmi_ventilairsec_mode
                    data:
                      option: Eco
              - type: conditional
                conditions:
                  - condition: state
                    entity: select.vmi_ventilairsec_mode
                    state_not: Eco
                card:
                  type: tile
                  entity: select.vmi_ventilairsec_mode
                  name: Eco
                  icon: mdi:leaf
                  color: disabled
                  hide_state: true
                  vertical: true
                  tap_action:
                    action: perform-action
                    perform_action: select.select_option
                    target:
                      entity_id: select.vmi_ventilairsec_mode
                    data:
                      option: Eco
                  icon_tap_action:
                    action: perform-action
                    perform_action: select.select_option
                    target:
                      entity_id: select.vmi_ventilairsec_mode
                    data:
                      option: Eco
              - type: conditional
                conditions:
                  - condition: state
                    entity: select.vmi_ventilairsec_mode
                    state: Standard
                card:
                  type: tile
                  entity: select.vmi_ventilairsec_mode
                  name: Standard
                  icon: mdi:fan
                  color: blue
                  hide_state: true
                  vertical: true
                  tap_action:
                    action: perform-action
                    perform_action: select.select_option
                    target:
                      entity_id: select.vmi_ventilairsec_mode
                    data:
                      option: Standard
                  icon_tap_action:
                    action: perform-action
                    perform_action: select.select_option
                    target:
                      entity_id: select.vmi_ventilairsec_mode
                    data:
                      option: Standard
              - type: conditional
                conditions:
                  - condition: state
                    entity: select.vmi_ventilairsec_mode
                    state_not: Standard
                card:
                  type: tile
                  entity: select.vmi_ventilairsec_mode
                  name: Standard
                  icon: mdi:fan
                  color: disabled
                  hide_state: true
                  vertical: true
                  tap_action:
                    action: perform-action
                    perform_action: select.select_option
                    target:
                      entity_id: select.vmi_ventilairsec_mode
                    data:
                      option: Standard
                  icon_tap_action:
                    action: perform-action
                    perform_action: select.select_option
                    target:
                      entity_id: select.vmi_ventilairsec_mode
                    data:
                      option: Standard
              - type: conditional
                conditions:
                  - condition: state
                    entity: select.vmi_ventilairsec_mode
                    state: Confort
                card:
                  type: tile
                  entity: select.vmi_ventilairsec_mode
                  name: Confort
                  icon: mdi:fan-chevron-up
                  color: deep-orange
                  hide_state: true
                  vertical: true
                  tap_action:
                    action: perform-action
                    perform_action: select.select_option
                    target:
                      entity_id: select.vmi_ventilairsec_mode
                    data:
                      option: Confort
                  icon_tap_action:
                    action: perform-action
                    perform_action: select.select_option
                    target:
                      entity_id: select.vmi_ventilairsec_mode
                    data:
                      option: Confort
              - type: conditional
                conditions:
                  - condition: state
                    entity: select.vmi_ventilairsec_mode
                    state_not: Confort
                card:
                  type: tile
                  entity: select.vmi_ventilairsec_mode
                  name: Confort
                  icon: mdi:fan-chevron-up
                  color: disabled
                  hide_state: true
                  vertical: true
                  tap_action:
                    action: perform-action
                    perform_action: select.select_option
                    target:
                      entity_id: select.vmi_ventilairsec_mode
                    data:
                      option: Confort
                  icon_tap_action:
                    action: perform-action
                    perform_action: select.select_option
                    target:
                      entity_id: select.vmi_ventilairsec_mode
                    data:
                      option: Confort

          # --- Alerte défaut (n'apparaît qu'en cas de problème) ----------------------
          - type: conditional
            conditions:
              - condition: state
                entity: binary_sensor.vmi_ventilairsec_probleme
                state: "on"
            card:
              type: tile
              entity: sensor.vmi_ventilairsec_defaut
              name: Défaut VMI
              icon: mdi:alert
              color: red

          # --- État en un coup d'œil ------------------------------------------------
          - type: glance
            show_name: true
            columns: 3
            entities:
              - entity: sensor.vmi_ventilairsec_etat_systeme
                name: État
              - entity: sensor.vmi_ventilairsec_debit_d_air
                name: Débit
              - entity: sensor.vmi_ventilairsec_vitesse_moteur
                name: Vitesse
              - entity: sensor.vmi_ventilairsec_temperature_exterieure
                name: Extérieur
              - entity: sensor.vmi_ventilairsec_temperature_entree_d_air
                name: Entrée d'air
              - entity: sensor.assistant_ventilairsec_temperature
                name: Intérieur

          # --- Actions rapides ------------------------------------------------------
          - type: grid
            columns: 2
            square: false
            cards:
              - type: tile
                entity: sensor.vmi_ventilairsec_boost_restant
                name: Boost
                icon: mdi:fan-plus
                color: deep-orange
                tap_action:
                  action: perform-action
                  perform_action: number.set_value
                  target:
                    entity_id: number.vmi_ventilairsec_boost_duree
                  data:
                    value: 30
                hold_action:
                  action: perform-action
                  perform_action: number.set_value
                  target:
                    entity_id: number.vmi_ventilairsec_boost_duree
                  data:
                    value: 0
                icon_tap_action:
                  action: more-info
              - type: tile
                entity: switch.vmi_ventilairsec_surventilation
                name: Surventilation
                color: cyan
                tap_action:
                  action: toggle
              - type: tile
                entity: switch.vmi_ventilairsec_debit_fixe
                name: Débit fixe
                color: indigo
                tap_action:
                  action: toggle
              - type: tile
                entity: number.vmi_ventilairsec_vacances_jours
                name: Vacances
                icon: mdi:palm-tree
                color: green
                features_position: bottom
                features:
                  - type: numeric-input
                    style: buttons
              # Arrêt = mode Standby (bouton marche/arrêt de l'application VMI+) ;
              # on redémarre en touchant Eco, Standard ou Confort.
              - type: tile
                entity: select.vmi_ventilairsec_mode
                name: Arrêt
                icon: mdi:power
                color: red
                hide_state: true
                tap_action:
                  action: perform-action
                  perform_action: select.select_option
                  target:
                    entity_id: select.vmi_ventilairsec_mode
                  data:
                    option: Standby
                  confirmation:
                    text: Mettre la VMI à l'arrêt (Standby) ?
                icon_tap_action:
                  action: perform-action
                  perform_action: select.select_option
                  target:
                    entity_id: select.vmi_ventilairsec_mode
                  data:
                    option: Standby
                  confirmation:
                    text: Mettre la VMI à l'arrêt (Standby) ?

          # --- Confort intérieur (Assistant) & filtre --------------------------------
          - type: grid
            columns: 2
            square: false
            cards:
              - type: vertical-stack
                cards:
                  - type: tile
                    entity: sensor.assistant_ventilairsec_humidite
                    name: Humidité
                    color: light-blue
                  # 365 j moins le temps écoulé depuis le changement de filtre, à ± 3 jours de l'appli
                  - type: tile
                    entity: sensor.vmi_ventilairsec_autonomie_filtre
                    name: Autonomie filtre
                    icon: mdi:calendar-clock
                    color: teal
              # Durée de vie restante, comme l'application VMI+ (100 % = neuf)
              - type: gauge
                entity: sensor.vmi_ventilairsec_filtre_restant
                name: Filtre restant
                min: 0
                max: 100
                needle: true
                severity:
                  red: 0
                  yellow: 15
                  green: 40

          # --- Réglages et maintenance (repliables via "plus d'infos") ---------------
          - type: entities
            title: Réglages
            state_color: true
            entities:
              - entity: number.vmi_ventilairsec_consigne_prechauffage
                name: Préchauffage résistance
              - entity: number.vmi_ventilairsec_consigne_hydror
                name: Préchauffage Hydro'R
              - entity: number.vmi_ventilairsec_temperature_max_soufflage
                name: Température max soufflage
              - type: divider
              - entity: sensor.vmi_ventilairsec_saison
                name: Saison
              - entity: sensor.vmi_ventilairsec_puissance_prechauffage
                name: Puissance préchauffage
              - entity: sensor.vmi_ventilairsec_semaines_depuis_maintenance
                name: Semaines depuis maintenance
              - entity: sensor.assistant_ventilairsec_batterie
                name: Pile de l'Assistant
              - entity: sensor.vmi_ventilairsec_derniere_trame
                name: Dernière communication
                format: relative
              - type: buttons
                entities:
                  - entity: button.vmi_ventilairsec_reinitialiser_filtre
                    name: RAZ filtre
                    icon: mdi:air-filter
                    tap_action:
                      action: perform-action
                      perform_action: button.press
                      target:
                        entity_id: button.vmi_ventilairsec_reinitialiser_filtre
                      confirmation:
                        text: Réinitialiser le compteur d'encrassement du filtre ?
                  - entity: button.vmi_ventilairsec_synchroniser_l_horloge
                    name: Sync horloge
                    icon: mdi:clock-check
                    tap_action:
                      action: perform-action
                      perform_action: button.press
                      target:
                        entity_id: button.vmi_ventilairsec_synchroniser_l_horloge

          # --- Export : ouvre l'Historique avec les capteurs de la VMI ; choisir la
          # période puis l'icône « Télécharger les données » (CSV) en haut à droite.
          - type: button
            name: Exporter l'historique (CSV)
            icon: mdi:download
            show_state: false
            icon_height: 32px
            tap_action:
              action: navigate
              navigation_path: /history?entity_id=sensor.vmi_ventilairsec_mode_etat,sensor.vmi_ventilairsec_etat_systeme,sensor.vmi_ventilairsec_debit_d_air,sensor.vmi_ventilairsec_vitesse_moteur,sensor.vmi_ventilairsec_temperature_exterieure,sensor.vmi_ventilairsec_temperature_sortie_des_resistances,sensor.vmi_ventilairsec_humidite_sortie_des_resistances,sensor.vmi_ventilairsec_temperature_entree_d_air,sensor.vmi_ventilairsec_humidite_entree_d_air,sensor.vmi_ventilairsec_temperature_sortie_boucle_d_eau,sensor.vmi_ventilairsec_humidite_sortie_boucle_d_eau,sensor.vmi_ventilairsec_puissance_prechauffage,sensor.vmi_ventilairsec_rapport_cyclique_boucle_d_eau,sensor.vmi_ventilairsec_consigne_pression_differentielle,sensor.vmi_ventilairsec_filtre_restant,sensor.vmi_ventilairsec_signal_radio,sensor.assistant_ventilairsec_temperature,sensor.assistant_ventilairsec_humidite

  # === Colonne de droite : graphiques ========================================
  - type: grid
    cards:
      - type: heading
        heading: Graphiques
        heading_style: title
      - type: vertical-stack
        cards:
          # --- Historique ------------------------------------------------------------
          - type: custom:mini-graph-card
            name: Débit & températures (24 h)
            hours_to_show: 24
            points_per_hour: 6
            line_width: 2
            show:
              labels: true
              legend: true
            entities:
              - entity: sensor.vmi_ventilairsec_debit_d_air
                name: Débit
                color: "#2196f3"
              - entity: sensor.vmi_ventilairsec_temperature_exterieure
                name: Extérieur
                color: "#ff9800"
                y_axis: secondary
              - entity: sensor.assistant_ventilairsec_temperature
                name: Intérieur
                color: "#4caf50"
                y_axis: secondary

          # --- Historique long terme (statistiques, y compris l'import Jeedom) --------
          # Carte apexcharts-card (HACS) : min, moyenne et max mensuels ; la valeur
          # « Actuelle » en en-tête est cliquable (historique).
          - type: custom:apexcharts-card
            header:
              show: true
              title: Température intérieure par mois
              standard_format: true
              show_states: true
              colorize_states: false
            graph_span: 1650d
            yaxis:
              - decimals: 0
            series:
              - entity: sensor.assistant_ventilairsec_temperature
                name: Minimum
                show:
                  in_header: false
                statistics:
                  type: min
                  period: month
                  align: start
                stroke_width: 1
                color: "#9db4e6"
                extend_to: false
                float_precision: 1
              - entity: sensor.assistant_ventilairsec_temperature
                name: Moyenne
                show:
                  in_header: false
                statistics:
                  type: mean
                  period: month
                  align: start
                stroke_width: 3
                color: "#3b66c4"
                extend_to: false
                float_precision: 1
              - entity: sensor.assistant_ventilairsec_temperature
                name: Maximum
                show:
                  in_header: false
                statistics:
                  type: max
                  period: month
                  align: start
                stroke_width: 1
                color: "#e0868a"
                extend_to: false
                float_precision: 1
              - entity: sensor.assistant_ventilairsec_temperature
                name: Actuelle
                float_precision: 1
                show:
                  in_chart: false
                  in_header: raw
            apex_config:
              xaxis:
                labels:
                  datetimeUTC: false
                  datetimeFormatter:
                    year: yyyy
                    month: MMM yyyy
              tooltip:
                x:
                  format: MMMM yyyy
          - type: custom:apexcharts-card
            header:
              show: true
              title: Humidité intérieure par mois
              standard_format: true
              show_states: true
              colorize_states: false
            graph_span: 1650d
            yaxis:
              - decimals: 0
            series:
              - entity: sensor.assistant_ventilairsec_humidite
                name: Minimum
                show:
                  in_header: false
                statistics:
                  type: min
                  period: month
                  align: start
                stroke_width: 1
                color: "#9db4e6"
                extend_to: false
                float_precision: 1
              - entity: sensor.assistant_ventilairsec_humidite
                name: Moyenne
                show:
                  in_header: false
                statistics:
                  type: mean
                  period: month
                  align: start
                stroke_width: 3
                color: "#3b66c4"
                extend_to: false
                float_precision: 1
              - entity: sensor.assistant_ventilairsec_humidite
                name: Maximum
                show:
                  in_header: false
                statistics:
                  type: max
                  period: month
                  align: start
                stroke_width: 1
                color: "#e0868a"
                extend_to: false
                float_precision: 1
              - entity: sensor.assistant_ventilairsec_humidite
                name: Actuelle
                float_precision: 1
                show:
                  in_chart: false
                  in_header: raw
            apex_config:
              xaxis:
                labels:
                  datetimeUTC: false
                  datetimeFormatter:
                    year: yyyy
                    month: MMM yyyy
              tooltip:
                x:
                  format: MMMM yyyy

          # Qualité de réception à la clé EnOcean (figée si l'appareil se tait)
          # Un graphique par appareil, moyenne sur 10 min, trous quand le capteur est
          # indisponible (expire_after), ligne de signal faible à -90 dBm. Pas d'align_to :
          # il se trompe avec des valeurs négatives. La valeur en en-tête est cliquable
          # (historique).
          # --- Signal radio (24 h) --------------------------------------------------
          - type: custom:apexcharts-card
            header:
              show: true
              title: Signal radio VMI (24 h)
              standard_format: true
              show_states: true
              colorize_states: false
            graph_span: 24h
            yaxis:
            - min: ~-90
              max: ~-70
              decimals: 0
              apex_config:
                tickAmount: 4
            series:
            - entity: sensor.vmi_ventilairsec_signal_radio
              name: VMI
              show:
                in_header: raw
              color: '#ff9800'
              stroke_width: 2
              curve: smooth
              extend_to: now
              float_precision: 0
              group_by:
                func: avg
                duration: 10min
                fill: last
            apex_config:
              chart:
                height: 150
              legend:
                show: false
              xaxis:
                labels:
                  datetimeUTC: false
              tooltip:
                x:
                  format: dd/MM HH:mm
              annotations:
                yaxis:
                - y: -90
                  borderColor: '#e53935'
                  strokeDashArray: 4
                  label:
                    text: signal faible (-90 dBm)
                    position: left
                    textAnchor: start
                    borderWidth: 0
                    style:
                      color: '#e53935'
                      background: transparent
          - type: custom:apexcharts-card
            header:
              show: true
              title: Signal radio Assistant (24 h)
              standard_format: true
              show_states: true
              colorize_states: false
            graph_span: 24h
            yaxis:
            - min: ~-75
              max: ~-45
              decimals: 0
              apex_config:
                tickAmount: 6
            series:
            - entity: sensor.assistant_ventilairsec_signal_radio
              name: Assistant
              show:
                in_header: raw
              color: '#4caf50'
              stroke_width: 2
              curve: smooth
              extend_to: now
              float_precision: 0
              group_by:
                func: avg
                duration: 10min
                fill: last
            apex_config:
              chart:
                height: 150
              legend:
                show: false
              xaxis:
                labels:
                  datetimeUTC: false
              tooltip:
                x:
                  format: dd/MM HH:mm
