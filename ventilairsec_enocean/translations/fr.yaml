configuration:
  serial_port:
    name: Port de la clé EnOcean
    description: Chemin stable de la clé, de préférence /dev/serial/by-id/... (Paramètres → Système → Matériel), ou socket://IP:port pour un module partagé sur le réseau (ser2net).
  fallback_port:
    name: Port de secours
    description: Facultatif. Second port (clé USB ou socket://IP:port) utilisé si le premier ne répond plus ; retour automatique sur le premier dès qu'il répond.
  vmi_id:
    name: Identifiant de la VMI
    description: ID EnOcean de la VMI, 8 caractères hexadécimaux (logicalId dans la sauvegarde Jeedom).
  assistant_id:
    name: Identifiant de l'Assistant
    description: ID EnOcean de l'Assistant (sonde d'ambiance). Laisser vide s'il n'y en a pas.
  sender_id:
    name: Identifiant d'émission
    description: ID utilisé pour envoyer les commandes. Vide = Base ID de la clé. Voir la documentation (actionid de Jeedom).
  force_base_id:
    name: Forcer le Base ID
    description: Écrit ce Base ID dans la clé au démarrage. 10 écritures maximum sur la durée de vie de la clé ! Remettre à vide ensuite.
  sync_clock:
    name: Synchroniser l'horloge
    description: Envoie l'heure à la VMI au démarrage puis toutes les heures (elle la perd à chaque coupure de courant).
  accept_pairing:
    name: Accepter l'appairage
    description: Répond aux demandes d'appairage de la VMI (après sa mise sous tension) tant qu'elle n'est pas appairée, pour qu'elle obéisse aux commandes. Seule la VMI configurée est concernée.
  topic_prefix:
    name: Préfixe MQTT
    description: Début des topics MQTT publiés.
  log_level:
    name: Niveau de journal
    description: debug affiche toutes les trames radio brutes.
  mqtt_host:
    name: Broker MQTT externe
    description: Facultatif. Adresse d'un broker hors Home Assistant (ex. 192.168.1.20). Vide = broker fourni par Home Assistant (add-on Mosquitto).
  mqtt_port:
    name: Port du broker externe
    description: Port du broker externe (1883 par défaut). Ignoré sans broker externe.
  mqtt_user:
    name: Utilisateur MQTT
    description: Utilisateur du broker externe. Vide = connexion anonyme.
  mqtt_password:
    name: Mot de passe MQTT
    description: Mot de passe du broker externe.
